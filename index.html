<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV ⇄ JSON 转换器</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>CSV ⇄ JSON 转换器</h1>
    <p class="subtitle">Web Worker 解析 · 大文件分块 · 本地历史记录</p>
  </header>

  <main>
    <section class="toolbar">
      <label>
        方向
        <select id="direction">
          <option value="csv2json">CSV → JSON</option>
          <option value="json2csv">JSON → CSV</option>
        </select>
      </label>
      <label>
        分隔符
        <select id="delimiter">
          <option value=",">逗号 ,</option>
          <option value=";">分号 ;</option>
          <option value="\t">制表符 Tab</option>
          <option value="|">竖线 |</option>
          <option value="custom">自定义…</option>
        </select>
      </label>
      <input id="customDelimiter" maxlength="1" placeholder="分隔符" style="display:none" size="3">
      <span id="optCsv2json">
        <label><input type="checkbox" id="hasHeader" checked> 含表头</label>
        <label><input type="checkbox" id="inferTypes" checked> 类型推断（数字/布尔）</label>
      </span>
      <span id="optJson2csv" style="display:none">
        <label><input type="checkbox" id="includeHeader" checked> 输出表头行</label>
      </span>
    </section>

    <section class="panes">
      <div class="pane">
        <div class="pane-head">
          <span>输入</span>
          <span>
            <button id="pickFileBtn" type="button">选择文件</button>
            <input type="file" id="fileInput" accept=".csv,.json,.txt" hidden>
            <button id="clearBtn" type="button">清空</button>
          </span>
        </div>
        <textarea id="input" spellcheck="false"></textarea>
      </div>
      <div class="pane">
        <div class="pane-head">
          <span>输出 <small id="outputNote" class="note"></small></span>
          <span>
            <button id="copyBtn" type="button">复制</button>
            <button id="exportBtn" type="button">导出文件</button>
          </span>
        </div>
        <textarea id="output" spellcheck="false" readonly></textarea>
      </div>
    </section>

    <section class="actions">
      <button id="convertBtn" type="button" class="primary">开始转换</button>
      <span id="status" class="status">就绪</span>
      <span id="progress" class="progress" style="display:none"><span id="progressBar"></span></span>
    </section>

    <section id="warnings" class="warnings" style="display:none"></section>

    <section class="history">
      <div class="pane-head">
        <span>历史记录（IndexedDB）</span>
        <button id="clearHistoryBtn" type="button">清空历史</button>
      </div>
      <ul id="historyList"></ul>
    </section>
  </main>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
